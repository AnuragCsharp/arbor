<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1411" />
    <meta name="description" content="ARBOR — plant low-poly trees in your room with Web AR. No app, no login, free." />
    <title>ARBOR · Web AR Tree Planter</title>
  </head>
  <body>
    <div id="app">
      <!-- Top status / error toast -->
      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <!-- Intro / launch screen -->
      <section id="intro" class="intro">
        <header class="brand">
          <div class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="40" height="40">
              <path d="M24 4C15 10 15 20 24 24c9-4 9-14 0-20Z" fill="#4ade80" />
              <path d="M12 20c-6 5-4 14 6 14 2 6 10 6 12 0 10 0 12-9 6-14" fill="#22c55e" opacity="0.9" />
              <rect x="22" y="30" width="4" height="12" rx="1.5" fill="#92400e" />
            </svg>
          </div>
          <div class="brand__text">
            <h1>ARBOR</h1>
            <p>Plant a forest in your room.</p>
          </div>
        </header>

        <div class="intro__card">
          <p class="intro__lead">
            Pick a tree, point your phone at the floor, and watch it grow — right where you stand.
            No install, no account.
          </p>

          <div id="caps" class="caps" aria-label="Device capabilities"></div>

          <button id="startBtn" class="btn btn--primary" type="button">Start AR</button>
          <p id="startHint" class="intro__hint"></p>
        </div>

        <!-- model-viewer for the iOS Quick Look pathway is injected here on demand -->
        <div id="iosStage" class="ios-stage" hidden></div>
      </section>

      <!-- In-session DOM overlay (WebXR) / shared controls -->
      <div id="overlay" class="overlay" hidden>
        <div id="scan" class="scan">
          <div class="scan__pulse" aria-hidden="true"></div>
          <p class="scan__text">Move your phone slowly to scan the floor…</p>
        </div>

        <div class="hud hud--top">
          <span id="hudTree" class="chip">Oak</span>
          <button id="exitBtn" class="chip chip--btn" type="button">Exit</button>
        </div>

        <div class="hud hud--bottom">
          <label class="slider">
            <span>Size</span>
            <input id="scaleSlider" type="range" min="0.5" max="2" step="0.05" value="1" />
            <span id="scaleVal" class="slider__val">100%</span>
          </label>
          <div class="hud__row">
            <button id="undoBtn" class="btn btn--ghost" type="button">Undo</button>
            <button id="clearBtn" class="btn btn--ghost" type="button">Clear all</button>
            <span id="placedCount" class="chip chip--dim">0 planted</span>
          </div>
          <p class="hud__tip">Tap when the ring turns green to plant the tree.</p>
        </div>
      </div>

      <!-- Tree selector (always available) -->
      <nav id="selector" class="selector" aria-label="Choose a tree"></nav>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
